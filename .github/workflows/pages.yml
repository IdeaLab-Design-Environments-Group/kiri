# Build the Vite app and publish it to GitHub Pages.
#
# Pages cannot serve this repo directly: index.html asks for /src/main.ts, which is TypeScript.
# A static host returns its 404 page for that, the browser sees text/html where it wanted a
# module, and X-Content-Type-Options: nosniff makes it refuse to run. So the site has to be the
# built output, never the source tree.
#
# `vite.config.ts` sets base to "./", so the bundle works under a project path (/Kiri/) without
# knowing the repo name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the running one instead of cancelling it.
#
# This was `cancel-in-progress: true`. On 4 Nov two pull requests were merged back to back: the first run was
# cancelled in the middle of `deploy-pages`, and every deployment after it then sat in the Pages queue until it
# timed out after ten minutes. The site stayed on the old version, and redeploying the same commit failed
# three more times, because a Pages deployment is keyed by the commit and that key was already cancelled. The
# cancelled run is the only odd thing in that sequence, so this stops cancelling; it is the most likely cause,
# not a proven one. A run that is waiting is still replaced by a newer one, so a quick series of merges ends
# with the latest commit deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc --noEmit && vite build`, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
