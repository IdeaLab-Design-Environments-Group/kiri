# Build the Vite app and publish it to GitHub Pages.
#
# Pages cannot serve this repo directly: index.html asks for /src/main.ts, which is TypeScript.
# A static host returns its 404 page for that, the browser sees text/html where it wanted a
# module, and X-Content-Type-Options: nosniff makes it refuse to run. So the site has to be the
# built output, never the source tree.
#
# `vite.config.ts` sets base to "./", so the bundle works under a project path (/Kiri/) without
# knowing the repo name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc --noEmit && vite build`, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
